name: Release

# On every push to main, read the version from manifest.json and publish a GitHub
# release for it if one does not already exist. HACS then offers that release to users.
# Workflow: bump "version" in custom_components/ha_ble_wattcycle/manifest.json, push to
# main -> a new release/tag appears automatically. Unchanged version = no-op.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        run: |
          VERSION="$(jq -r '.version' custom_components/ha_ble_wattcycle/manifest.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::No version found in manifest.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to do."
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
